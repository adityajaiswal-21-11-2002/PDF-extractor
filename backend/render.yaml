# Render Blueprint - 100% FREE tier (web + DB + Redis)
# Celery runs inside the web service (no paid worker)
# Deploy: Dashboard → New → Blueprint → Connect repo → Blueprint path: backend/render.yaml
# If your repo root IS the backend folder, remove rootDir: backend

databases:
  - name: agent-db
    databaseName: agent_orchestrator
    plan: free

services:
  - type: keyvalue
    name: agent-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  - type: web
    name: agent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip setuptools && pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: ENV
        value: prod
      - key: EMAIL_BACKEND
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
